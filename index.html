<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="IELTS Listening spelling practice: 1,128 words. Hear each word and type it. Mistakes are explained, fixed and brought back until they stick.">
<title>IELTS Spelling Lab</title>
<style>
/* IELTS Spelling Lab: a focused typing test in the same navy / Georgia colours as the other pages. */
:root {
  color-scheme: light;
  --bg: #EDF0F4; --page: #FFFFFF; --ink: #111111; --muted: #3D4A56; --faint: #5A6773; --line: #D7DEE5; --row: #F8FAFB;
  --navy: #14365A; --navy-ink: #FFFFFF; --qn: #2C6E9B;
  --tech: #EEF3F8; --tech-edge: #2C6E9B; --tech-lab: #1F5D87;
  --psg: #FCFAF4; --psg-edge: #C9A227; --psg-lab: #96781C; --psg-line: #E8DDC0;
  --get: #F1F7F1; --get-edge: #2E7D32; --get-lab: #256428;
  --same: #F5F2FA; --same-edge: #5B4B9A; --same-lab: #4A3D82;
  --bad: #B23A2E; --bad-bg: #FDF2F1; --bad-lab: #96291F; --ok: #2E7D32; --ok-soft: #E6F3E7; --mid: #9A6A0E; --mid-soft: #FBF2DE;
  --f-text: Georgia, "Times New Roman", serif; --f-ui: "Segoe UI", Arial, sans-serif; --f-mono: Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 17px; line-height: 1.55; }
button, select, input { font-family: var(--f-ui); }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--tech-edge); outline-offset: 2px; }
[hidden] { display: none !important; }
b, strong { color: var(--navy); font-weight: 700; }
a { color: var(--qn); }
h1, h2, h3 { font-family: var(--f-ui); color: var(--navy); margin: 0; text-wrap: balance; }
h2 { font-size: 22px; margin: 28px 0 10px; } h3 { font-size: 16.5px; margin: 18px 0 8px; }
p { margin: 0 0 12px; }
.small { font-family: var(--f-ui); font-size: 14px; color: var(--faint); }

.top { position: sticky; top: 0; z-index: 30; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 6px 16px; padding: 8px 18px; font-family: var(--f-ui); flex-wrap: wrap; }
.top .brand { font-size: 18px; font-weight: 700; color: #fff; text-decoration: none; margin-right: 8px; }
.top nav { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
.top nav a { color: #DCE6F2; text-decoration: none; padding: 6px 11px; font-size: 14px; font-weight: 600; }
.top nav a:hover { background: rgba(255,255,255,.12); } .top nav a.on { background: #fff; color: var(--navy); }
.top .gear { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.45); padding: 5px 11px; font-size: 13.5px; }
main { max-width: 900px; margin: 0 auto; padding: 22px 18px 80px; }
@media (max-width: 560px) { main { padding: 12px 10px 60px; } .top { padding: 7px 10px; } .top .brand { font-size: 16px; } }

.card { background: var(--page); border: 1px solid var(--line); padding: 18px 22px; margin: 0 0 14px; }
.card.edge { border-left: 4px solid var(--navy); }
.hero { background: var(--page); border: 1px solid var(--line); border-top: 6px solid var(--navy); padding: 22px 26px; margin-bottom: 14px; }
.hero h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.15; margin-bottom: 8px; }
.hero .sub { font-size: 18px; font-style: italic; color: var(--muted); margin: 0; }
.box { padding: 14px 20px; margin: 14px 0; } .box > :last-child { margin-bottom: 0; }
.lab { display: block; font-family: var(--f-ui); font-size: 12.5px; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
.tech { background: var(--tech); border-left: 4px solid var(--tech-edge); } .tech .lab { color: var(--tech-lab); }
.get { background: var(--get); border-left: 4px solid var(--get-edge); } .get .lab { color: var(--get-lab); }
.same { background: var(--same); border-left: 4px solid var(--same-edge); } .same .lab { color: var(--same-lab); }
.warn { background: var(--bad-bg); border-left: 4px solid var(--bad); } .warn .lab { color: var(--bad-lab); }
.qbox { background: var(--psg); border: 1px solid var(--psg-line); border-left: 4px solid var(--psg-edge); } .qbox .lab { color: var(--psg-lab); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--page); border: 1px solid var(--line); padding: 12px 14px; font-family: var(--f-ui); }
.stat .n { font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1.1; font-variant-numeric: tabular-nums; } .stat .t { font-size: 12.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-top: 3px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-bottom: 14px; }
.mode { text-align: left; background: var(--page); border: 1px solid var(--line); border-top: 4px solid var(--navy); padding: 14px 18px 16px; font-family: var(--f-text); color: var(--ink); font-size: 16px; line-height: 1.4; }
.mode:hover { border-color: var(--navy); }
.mode b { display: block; font-family: var(--f-ui); font-size: 16.5px; margin-bottom: 4px; }
.mode .small { display: block; margin-top: 6px; }
.mode.gold { border-top-color: var(--psg-edge); } .mode.red { border-top-color: var(--bad); } .mode.green { border-top-color: var(--get-edge); }
.mode:disabled { opacity: .55; cursor: default; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 8px; }
.cat { display: block; width: 100%; text-align: left; background: var(--page); border: 1px solid var(--line); padding: 10px 14px; font-family: var(--f-ui); color: var(--ink); }
.cat:hover { border-color: var(--navy); }
.cat .ct { display: flex; gap: 8px; font-weight: 600; font-size: 14.5px; line-height: 1.3; } .cat .ct i { font-style: normal; color: var(--qn); font-weight: 700; min-width: 22px; }
.bar { height: 6px; background: var(--line); margin: 8px 0 3px; display: flex; } .bar i { display: block; height: 100%; } .bar .m { background: var(--ok); } .bar .l { background: var(--psg-edge); }
.cat .cn { font-size: 12.5px; color: var(--faint); }
.errs { display: grid; gap: 6px; font-family: var(--f-ui); font-size: 14px; }
.erow { display: grid; grid-template-columns: 190px minmax(0, 1fr) 36px; gap: 10px; align-items: center; }
.erow .bar { margin: 0; } .erow .bar i { background: var(--bad); }
@media (max-width: 560px) { .erow { grid-template-columns: 130px minmax(0, 1fr) 30px; } }

/* ---------- buttons ---------- */
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 4px; font-family: var(--f-ui); }
.primary { background: var(--navy); color: var(--navy-ink); border: 1px solid var(--navy); padding: 10px 20px; font-weight: 600; font-size: 15px; letter-spacing: .3px; }
.primary:disabled { opacity: .5; cursor: default; }
.ghost { background: var(--page); color: var(--navy); border: 1px solid var(--line); padding: 9px 14px; font-size: 14.5px; font-weight: 600; } .ghost:hover { border-color: var(--navy); }
.danger { background: var(--bad); color: #fff; border: 1px solid var(--bad); padding: 8px 14px; font-weight: 600; font-size: 14px; }
.sm { padding: 6px 12px; font-size: 13.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); background: #fff; flex-wrap: wrap; } .seg button { border: 0; background: #fff; color: var(--muted); padding: 7px 13px; font-size: 14px; font-weight: 600; } .seg button + button { border-left: 1px solid var(--line); } .seg button.on { background: var(--navy); color: #fff; }

/* ---------- the test card ---------- */
.test { background: var(--page); border: 1px solid var(--line); border-top: 6px solid var(--navy); padding: 20px 26px 26px; }
.tprog { display: flex; align-items: center; gap: 14px; font-family: var(--f-ui); font-size: 14px; color: var(--muted); margin-bottom: 4px; flex-wrap: wrap; }
.tprog .pb { flex: 1; min-width: 120px; height: 8px; background: var(--line); } .tprog .pb i { display: block; height: 100%; background: var(--navy); }
.tprog b { color: var(--navy); }
.say { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 22px 0 8px; flex-wrap: wrap; }
.spk { width: 84px; height: 84px; border-radius: 50%; background: var(--navy); color: #fff; border: 0; display: grid; place-items: center; font-size: 34px; box-shadow: 0 3px 10px rgba(20,54,90,.35); }
.spk:hover { background: #1c4a7a; } .spk svg { width: 38px; height: 38px; fill: #fff; }
.say .side { display: grid; gap: 6px; font-family: var(--f-ui); }
.cue { text-align: center; font-family: var(--f-ui); color: var(--muted); font-size: 14.5px; margin-bottom: 6px; }
.flash { text-align: center; font-size: 46px; font-weight: 700; color: var(--navy); letter-spacing: 1px; margin: 18px 0 6px; min-height: 62px; }
.flash.hidden { color: var(--faint); font-size: 20px; font-weight: 400; letter-spacing: 0; padding-top: 18px; font-style: italic; }
.ans { display: block; width: 100%; max-width: 520px; margin: 10px auto 0; text-align: center; font-size: 30px; font-family: var(--f-mono); padding: 12px 14px; border: 2px solid var(--navy); background: #fff; color: var(--ink); letter-spacing: 1px; }
.ans:focus { outline: 3px solid rgba(44,110,155,.3); } .ans.good { border-color: var(--ok); background: var(--ok-soft); } .ans.bad { border-color: var(--bad); background: var(--bad-bg); }
.hintline { text-align: center; font-family: var(--f-mono); font-size: 22px; letter-spacing: 4px; color: var(--faint); margin-top: 10px; min-height: 30px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; font-family: var(--f-ui); }
.kbd { text-align: center; font-family: var(--f-ui); font-size: 12.5px; color: var(--faint); margin-top: 12px; }
.pop { text-align: center; font-family: var(--f-ui); font-weight: 700; font-size: 20px; color: var(--ok); margin-top: 12px; }

/* ---------- feedback and drill ---------- */
.fb { margin-top: 16px; }
.diff { font-family: var(--f-mono); font-size: 28px; letter-spacing: 2px; line-height: 1.35; margin: 4px 0 10px; word-break: break-all; }
.diff .lbl { display: block; font-family: var(--f-ui); font-size: 12.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.diff .x { color: var(--bad); font-weight: 700; background: #FBD5D0; } .diff .xs { color: var(--bad); text-decoration: line-through; background: #FBD5D0; }
.diff .gap { color: var(--bad); font-weight: 700; background: #FBD5D0; padding: 0 2px; } .diff .g { color: var(--ok); font-weight: 700; background: #CBE8CC; }
.trap { font-family: var(--f-mono); font-size: 34px; letter-spacing: 3px; color: var(--navy); margin: 6px 0; word-break: break-all; }
.trap .t-d { color: #fff; background: var(--bad); padding: 0 1px; } .trap .t-s { color: #fff; background: var(--same-edge); padding: 0 1px; }
.trap .t-v { color: #000; background: #FFE08A; padding: 0 1px; } .trap .t-p { color: #fff; background: var(--qn); padding: 0 1px; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-family: var(--f-ui); font-size: 13.5px; color: var(--muted); margin: 4px 0 8px; }
.legend i { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
.etype { display: inline-block; font-family: var(--f-ui); font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; background: var(--bad); color: #fff; padding: 2px 9px; margin-right: 8px; }
.copies { display: flex; gap: 8px; justify-content: center; font-family: var(--f-ui); margin: 8px 0; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--faint); }
.dot.on { border-color: var(--navy); color: var(--navy); } .dot.done { background: var(--ok); border-color: var(--ok); color: #fff; }

/* ---------- results, lists ---------- */
.result { border: 1px solid var(--line); border-left: 4px solid var(--navy); background: #F4F7FA; padding: 14px 20px; margin: 12px 0; font-family: var(--f-ui); }
.result.good { border-left-color: var(--ok); background: var(--ok-soft); } .result.mid { border-left-color: var(--mid); background: var(--mid-soft); } .result.low { border-left-color: var(--bad); background: var(--bad-bg); }
.big { font-size: 44px; font-weight: 700; color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums; } .big span { font-size: 20px; color: var(--faint); }
.tablewrap { overflow-x: auto; margin: 10px 0; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { background: var(--navy); color: var(--navy-ink); text-align: left; padding: 8px 10px; font-family: var(--f-ui); font-size: 12.5px; letter-spacing: .6px; text-transform: uppercase; font-weight: 600; }
td { padding: 8px 10px; border-bottom: 1px solid #E0E6EA; vertical-align: top; } tr:nth-child(even) td { background: var(--row); } td.k { font-weight: 700; color: var(--navy); }
.mono { font-family: var(--f-mono); }
.mrow { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; background: var(--page); border: 1px solid var(--line); padding: 8px 12px; margin-bottom: 6px; font-family: var(--f-ui); }
.mrow .w { font-family: var(--f-mono); font-size: 18px; font-weight: 700; color: var(--navy); } .mrow .bad { font-family: var(--f-mono); color: var(--bad); font-size: 14.5px; text-decoration: line-through; margin-left: 8px; }
.mrow .sp { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--navy); display: grid; place-items: center; padding: 0; } .mrow .sp svg { width: 16px; height: 16px; fill: var(--navy); }
.mrow .tags { grid-column: 2 / -1; font-size: 12.5px; color: var(--faint); }
.search { width: 100%; max-width: 420px; font-size: 16px; padding: 9px 12px; border: 1px solid var(--navy); background: #fff; }
.dotk { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line); margin-right: 7px; } .dotk.l { background: var(--psg-edge); } .dotk.m { background: var(--ok); } .dotk.x { background: var(--bad); }
.wchip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-mono); font-size: 15px; background: #fff; border: 1px solid var(--line); padding: 3px 9px; margin: 0 6px 6px 0; cursor: pointer; }
.wchip:hover { border-color: var(--navy); }
.modal { position: fixed; inset: 0; background: rgba(10,25,45,.55); z-index: 50; display: grid; place-items: center; padding: 14px; }
.modal .box2 { background: #fff; max-width: 480px; width: 100%; padding: 20px 24px; border-top: 6px solid var(--navy); max-height: 90vh; overflow-y: auto; font-family: var(--f-ui); }
.modal .row2 { display: grid; gap: 6px; margin: 12px 0; } .modal label { font-weight: 600; font-size: 14px; color: var(--muted); } .modal select { padding: 7px 9px; font-size: 15px; border: 1px solid var(--line); width: 100%; }
@media (max-width: 560px) { .test { padding: 14px 12px 20px; } .ans { font-size: 24px; } .trap { font-size: 26px; } .diff { font-size: 22px; } .flash { font-size: 36px; } }
@media (max-width: 560px) {
  .top .brand { order: 1; } .top .gear { order: 2; margin-left: auto; }
  .top nav { order: 3; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .top nav a { white-space: nowrap; }
}
</style>
</head>

<script>window.SP={"cats":[{"title":"High-Risk Double-Consonant Trap Words","short":"Double-consonant traps","intro":"Double consonants are the single largest source of lost marks in IELTS Listening gap-fill tasks. Watch closely for words with two sets of doubled letters—such as accommodation (cc, mm), committee (mm, tt, ee), embarrassment (rr, ss), and millennium (ll, nn)—versus words where a tempting double is actually single, such as professor (single f, double s) and necessary (single c, double s). Page 2 of 14 IELTS Listening Spelling Study Guide (1,000+ Words • 5+ Letters)","start":0,"end":64},{"title":"Silent-Letter & Tricky Consonant-Cluster Words","short":"Silent letters","intro":"English preserves historical letters that are completely silent when spoken by IELTS voice actors. Never omit the silent 'n' in autumn, column, environment, and government; the silent 'b' in plumber, climbing, and debt; the silent 'k' in knowledge; or the 'sc' cluster in conscious, science, and discipline.","start":64,"end":128},{"title":"Vowel Schwa & Suffix Confusion (-ance/-ence, -ant/-ent, -able/-ible)","short":"Schwa vowels and endings","intro":"Because unstressed vowels reduce to a neutral 'uh' sound in English, pronunciation will not tell you whether to write -ance or -ence, or -able or -ible. Memorize high-frequency IELTS nouns like maintenance, independence, existence, perseverance, significance, and convenience, and remember that 'separate' has an 'a' in the middle (sep-A-rate) while 'definite' has only 'i's (def-I-nite).","start":128,"end":192},{"title":"Calendar, Time, Seasons & Frequency","short":"Calendar and time","intro":"Section 1 booking and registration forms almost always test days, months, or time periods. Never drop the 'd' in Wednesday (Wed-nes-day) or the first 'r' in February (Feb-ru-ary), and distinguish between fortnight (two weeks), decade (10 years), century (100 years), and millennium (1,000 years).","start":192,"end":232},{"title":"University, Campus & Academic Life — Section 3","short":"University and campus","intro":"IELTS Listening Section 3 centers on academic discussions between students and tutors. Pay special attention to campus nouns such as tutorial, seminar, dissertation, bibliography, plagiarism, module, faculty, and registrar.","start":232,"end":296},{"title":"Academic Subjects & Scientific Disciplines — Sections 3 & 4","short":"Academic subjects","intro":"Subject names frequently appear in Section 3 course selection and Section 4 lecture introductions. Notice the 'aeo' in archaeology (British) / 'eo' in archeology (American), and the '-ics' ending in linguistics, mathematics, statistics, economics, and genetics.","start":296,"end":360},{"title":"Accommodation, Housing, Architecture & Property — Section 1","short":"Housing and property","intro":"Section 1 often features a student or traveler arranging homestay, dormitory, or rental housing. Master compound and property terms such as bungalow, duplex, condominium, terraced, landlord, tenant, basement, balcony, and conservatory.","start":360,"end":424},{"title":"Home Furnishings, Appliances & Household Items","short":"Home and appliances","intro":"Insurance claims (Section 1) and recycling/product design talks (Sections 2 & 4) frequently test household items. Watch the spelling of refrigerator (no 'd', unlike fridge), microwave, vacuum, cushion, curtain, and cabinet.","start":424,"end":488},{"title":"Finance, Banking, Pricing & Commerce — Section 1","short":"Finance and banking","intro":"Money matters appear in almost every Section 1 dialogue (deposits, refunds, membership fees) and Section 4 business lectures. Note that British English spells 'cheque' and 'instalment' while American English uses 'check' and 'installment'—both are accepted if used consistently.","start":488,"end":552},{"title":"Employment, Occupations & Workplace — Sections 1 & 2","short":"Jobs and the workplace","intro":"Job application dialogues in Section 1 and workplace briefings in Section 2 frequently test occupational nouns ending in -er, -or, -ist, and -ian, such as receptionist, electrician, optician, accountant, Attendant, and volunteer.","start":552,"end":616},{"title":"Health, Medicine, Fitness & Nutrition","short":"Health and fitness","intro":"Medical consultations (Section 1), fitness club tours (Section 2), and public health lectures (Section 4) require accurate spelling of clinical and dietary words like antibiotic, cholesterol, carbohydrate, diabetes, obesity, protein, symptom, and prescription.","start":616,"end":680},{"title":"Food, Agriculture, Ingredients & Culinary Terms","short":"Food and farming","intro":"Event catering in Section 1 and agricultural history in Section 4 frequently test food items and farming vocabulary. Watch out for blackcurrant, broccoli, cauliflower, cinnamon, vegetarian, fertiliser, irrigation, and pasteurisation.","start":680,"end":744},{"title":"Nature, Geography, Weather & Landscapes","short":"Nature and weather","intro":"Map-labeling in Section 2 and geographical lectures in Section 4 rely heavily on terrain and weather terms. Pay special attention to peninsula, archipelago, avalanche, canyon, glacier, reservoir, waterfall, and plateau.","start":744,"end":808},{"title":"Environment, Ecology, Climate & Energy — Section 4","short":"Environment and energy","intro":"Section 4 lectures frequently address renewable energy, conservation, and climate science. Note that North American 'aluminum' (4 syllables) and British 'aluminium' (5 syllables) are both valid on the IELTS test, and be careful with hydroelectric, deforestation, biodegradable, and pollutant. Page 11 of 14 IELTS Listening Spelling Study Guide (1,000+ Words • 5+ Letters)","start":808,"end":872},{"title":"Biology, Wildlife, Animal & Plant Kingdom — Section 4","short":"Wildlife and biology","intro":"Zoology and botany are among the most common topics in IELTS Listening Section 4. Be ready to spell classification and anatomy words such as amphibian, reptile, mammal, cetacean, predator, camouflage, hibernate, photosynthesis, and Pollination.","start":872,"end":936},{"title":"Travel, Aviation, Maritime & Ground Transport","short":"Travel and transport","intro":"Travel bookings (Section 1) and transport infrastructure talks (Section 2) regularly test vehicles, vessels, and transit nouns. Watch out for commuter (often confused with computer), helicopter, hovercraft, hydrofoil, limousine, passenger, and pedestrian.","start":936,"end":1000},{"title":"Tourism, Recreation, Sports, Arts & Hobbies — Section 2","short":"Sport, arts and hobbies","intro":"Section 2 frequently features guided tours of sports centres, parks, theatres, or festivals. Look out for compound and outdoor activity words like orienteering, abseiling, paragliding, snorkelling, embroidery, woodcarving, and championship.","start":1000,"end":1064},{"title":"City Infrastructure, Public Venues & Civic Governance","short":"City and civic life","intro":"Section 2 municipal talks and map tasks focus on city facilities, street layouts, and public services. IDP IELTS highlights 'society' and 'government' as two of the most frequently misspelled words on the test.","start":1064,"end":1128}],"words":["accommodation","address","affordable","allocate","allowance","anniversary","announcement","annual","apparatus","apparel","appliance","application","appointment","appreciate","appropriate","approval","approximate","arrangement","assessment","assignment","assistance","assistant","associate","association","assumption","assurance","attendance","attendant","attention","attitude","attraction","baggage","balloon","beginning","billiards","blossom","brilliant","broccoli","bulletin","business","butterfly","cancellation","carriage","cassette","challenge","channel","cinnamon","classical","classroom","colleague","collection","college","commercial","commission","commitment","committee","communication","community","commuter","compass","connection","copper","correction","corr   const ph = sess.phase;

  const id = sess.cur.id, answered = sess.rows.length, shownN = sess.cur.retry ? answered : Math.min(sess.total, answered + 1), mode = promptMode();
  let h = '<div class="test"><div class="tprog"><span><b>' + shownN + '</b> of ' + sess.total + (sess.cur.retry ? ' · second chance' : '') + '</span><span class="pb"><i style="width:' + (answered / sess.total * 100) + '%"></i></span><span>' + sess.correct + ' correct</span><button class="ghost sm" id="quit">' + (sess.exam ? 'Stop test' : 'Finish') + '</button></div>';
  if (ph === 'ask') {
    h += '<div class="say">' + (mode !== 'see' ? '<button class="spk" id="spk" aria-label="Hear the word again">' + SPK + '</button><div class="side"><button class="ghost sm" id="slow">Slow</button></div>' : '') + '</div>';
    if (mode !== 'hear') h += '<div class="flash" id="flash">' + esc(target(id)) + '</div>';
    h += '<div class="cue">' + (sess.mode === 'cat' ? esc(D.cats[sess.cat].short) + ' · ' : '') + (mode === 'see' ? 'Look at the word, then type it from memory.' : 'Type the word you hear.') + '</div>' +
      '<input class="ans" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the word" value="' + esc(sess.typed || '') + '"><div class="hintline" id="hint">' + esc(hintText(id)) + '</div>' +
      '<div class="row"><button class="primary" id="chk">Check ↵</button>' + (sess.exam ? '' : '<button class="ghost" id="hintb">Hint</button>') + '<button class="ghost" id="dk">' + (sess.exam ? 'Skip' : "I don't know") + '</button></div>' +
      '<div class="kbd">Enter = check · Ctrl+Space = replay' + (sess.exam ? ' · one replay allowed' : '') + '</div>';
  } else if (ph === 'ok') {
    const alt = sess.accepted && norm(sess.accepted) !== norm(target(id));
    h += '<div class="pop">✓ ' + (sess.cur.retry ? 'Got it this time' : 'Correct') + '</div><div class="trap" style="text-align:center">' + esc(sess.accepted || target(id)) + '</div>' + (alt ? '<p class="small" style="text-align:center">Accepted. The list spells it “' + esc(target(id)) + '”.</p>' : '') +
      (D.notes[id] ? '<p class="small" style="text-align:center">' + esc(D.notes[id]) + '</p>' : '') + '<div class="row"><button class="ghost" id="nx">Next ↵</button></div>';
  } else if (ph === 'fb') {
    const best = closest(id, sess.lastTyped || ''), cl = classify(sess.lastTyped || '', best), tr = traps(best), cat = D.cats[catOf(id)];
    h += '<div class="fb"><p style="text-align:center;margin:0"><span class="etype">' + (LABEL[cl.type] || 'Mistake') + '</span><b>Not quite.</b></p>' + diffHTML(sess.lastTyped || '', best) +
      '<div class="box same"><span class="lab">What went wrong</span><p>' + (cl.d ? esc(cl.d.replace(/\.$/, '')) + '. ' : '') + esc(TIPS[cl.type]) + '</p></div>' +
      '<div class="box get"><span class="lab">The word, with the trap letters marked</span><div class="trap">' + tr.html + '</div><div class="legend">' + tr.legend + '</div>' +
      (D.notes[id] ? '<p class="small" style="margin:6px 0 0"><b>Note:</b> ' + esc(D.notes[id]) + '</p>' : '') + '</div>' +
      (cat.intro ? '<details class="small"><summary>Why ' + esc(cat.short.toLowerCase()) + ' words are tricky</summary><p style="margin-top:6px">' + esc(cat.intro) + '</p></details>' : '') +
      '<div class="row"><button class="ghost" id="hear2">' + (TTS.ok ? 'Hear it again' : '') + '</button><button class="primary" id="fixb">Fix it: type it 3 times ↵</button></div></div>';
  } else if (ph === 'fix') {
    const f = sess.fix, tr = traps(target(id)), hide = f.n > 0 && !f.peeked;
    h += '<div class="fb"><h3 style="text-align:center;margin-top:6px">Fix it</h3><div class="copies">' + [0, 1, 2].map(i => '<span class="dot' + (i < f.n ? ' done' : i === f.n ? ' on' : '') + '">' + (i < f.n ? '✓' : i + 1) + '</span>').join('') + '</div>' +
      (hide ? '<div class="flash hidden">Word covered. Type it from memory.</div><div class="row"><button class="ghost sm" id="peek">Peek</button></div>' : '<div class="trap" style="text-align:center">' + tr.html + '</div><div class="legend" style="justify-content:center">' + tr.legend + '</div>') +
      (f.bad != null ? '<div class="box warn"><span class="lab">Not quite. Look at the word again.</span>' + diffHTML(f.bad, closest(id, f.bad)) + '</div>' : '') +
      '<div class="cue">' + (f.n === 0 ? 'Copy 1 of 3: type it while you look at it.' : 'Copy ' + (f.n + 1) + ' of 3: cover it and type it from memory.') + '</div>' +
      '<input class="ans" id="fans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the word"><div class="row"><button class="primary" id="fchk">Check ↵</button></div></div>';
  } else if (ph === 'fixdone') {
    h += '<div class="fb"><div class="pop">✓ Fixed. ' + esc(target(id)) + '</div><p class="small" style="text-align:center">This word will come back in a few words so you can prove you remember it.</p><div class="row"><button class="primary" id="cont">Continue ↵</button></div></div>';
  }
  h += '</div>'; app.innerHTML = h;
  bindSession(id, mode);
}
function bindSession(id, mode) {
  const ph = sess.phase, ans = $('#ans'), q = $('#quit');
  if (q) q.onclick = () => { clearTimeout(timer); if (sess.exam || sess.rows.length) { sess.queue = []; sess.phase = 'done'; renderSession(); } else { sess = null; location.hash = '#home'; } };
  if (ph === 'ask') {
    const speak = () => {
      if (!sess || sess.phase !== 'ask' || sess.cur.id !== id || mode === 'see') return;
      if (sess.exam && sess.replays > 1) return;
      say(target(id), sess.slow ? 0.55 : S.set.rate);
    };
    if (ans) { ans.focus(); ans.setSelectionRange(ans.value.length, ans.value.length); }
    const spk = $('#spk'); if (spk) spk.onclick = () => { if (sess.exam) { if (sess.replays >= 1) { spk.disabled = true; return; } sess.replays++; } sess.slow = false; say(target(id), S.set.rate); ans.focus(); };
    const sl = $('#slow'); if (sl) { if (sess.exam) sl.hidden = true; sl.onclick = () => { say(target(id), 0.5); ans.focus(); }; }
    $('#chk').onclick = () => { if (ans.value.trim()) submit(ans.value, false); else ans.focus(); };
    $('#dk').onclick = () => submit('', true);
    const hb = $('#hintb'); if (hb) hb.onclick = () => { sess.hint = Math.min(target(id).length, sess.hint + 1); sess.hinted = true; sess.typed = ans.value; $('#hint').textContent = hintText(id); ans.focus(); };
    if (mode !== 'hear') { const fl = $('#flash'); if (fl) { timer = setTimeout(() => { fl.classList.add('hidden'); fl.innerHTML = '<span style="cursor:pointer" id="show2">Word hidden. Click to show it again (counts as a hint).</span>'; const s2 = $('#show2'); if (s2) s2.onclick = () => { sess.hinted = true; fl.classList.remove('hidden'); fl.textContent = target(id); }; }, Math.max(1, S.set.flash) * 1000); } }
    if (mode !== 'see') { timer = timer || null; setTimeout(speak, 200); }
  } else if (ph === 'ok') { const n = $('#nx'); if (n) n.onclick = () => { clearTimeout(timer); nextWord(); }; }
  else if (ph === 'fb') { const f = $('#fixb'); f.onclick = startFix; f.focus(); const h2 = $('#hear2'); if (h2) { if (!TTS.ok) h2.hidden = true; h2.onclick = () => say(target(id), S.set.rate); } }
  else if (ph === 'fix') {
    const fa = $('#fans'); fa.focus(); const go = () => { if (fa.value.trim()) fixSubmit(fa.value); }; $('#fchk').onclick = go;
    const pk = $('#peek'); if (pk) pk.onclick = () => { sess.fix.peeked = true; renderSession(); };
  } else if (ph === 'fixdone') { const c = $('#cont'); c.onclick = afterFix; c.focus(); }
}
document.addEventListener('keydown', e => {
  if (!sess || location.hash !== '#test') return;
  const ph = sess.phase;
  if (e.key === 'Enter') {
    if (ph === 'ask') { const a = $('#ans'); if (a && a.value.trim()) { e.preventDefault(); submit(a.value, false); } }
    else if (ph === 'ok') { e.preventDefault(); clearTimeout(timer); nextWord(); }
    else if (ph === 'fb') { e.preventDefault(); startFix(); }
    else if (ph === 'fix') { const f = $('#fans'); if (f && f.value.trim()) { e.preventDefault(); fixSubmit(f.value); } }
    else if (ph === 'fixdone') { e.preventDefault(); afterFix(); }
  }
  if (e.ctrlKey && e.code === 'Space' && ph === 'ask') { e.preventDefault(); const s = $('#spk'); if (s) s.click(); }
});

function viewResults() {
  head(''); clearTimeout(timer);
  const done = sess.rows.length, ok = sess.rows.filter(r => r.ok).length, miss = sess.rows.filter(r => !r.ok), mins = Math.max(1, Math.round((Date.now() - sess.t0) / 60000));
  if (sess.exam && done) { S.exam.push(ok); S.exam = S.exam.slice(-20); if (done >= sess.total) S.examN = Math.max(S.examN, sess.tn || 0); save(); }
  const pct = done ? Math.round(ok / done * 100) : 0, cls = pct >= 90 ? 'good' : pct >= 70 ? 'mid' : 'low';
  const types = {}; miss.forEach(r => { const best = closest(r.id, r.typed || ''), c = classify(r.typed || '', best); types[c.type] = (types[c.type] || 0) + 1; });
  let h = '<div class="hero"><h1>' + (sess.exam ? 'Exam test ' + sess.tn + ' results' : 'Session complete') + '</h1></div><div class="result ' + cls + '"><span class="big">' + ok + '<span> / ' + done + '</span></span> &nbsp; first-time correct (' + pct + '%) · about ' + mins + ' min' +
    (sess.exam ? '<br><span class="small">In the real test every misspelled word scores zero, so this is your Listening spelling score. The next exam test will be a new set of 40 words.</span>' : '') + '</div>';
  if (Object.keys(types).length) h += '<div class="card"><b>What went wrong</b><div class="errs" style="margin-top:8px">' + Object.keys(types).sort((a, b) => types[b] - types[a]).map(k => '<div class="erow"><span>' + LABEL[k] + '</span><span class="bar"><i style="width:' + (types[k] / miss.length * 100) + '%"></i></span><b>' + types[k] + '</b></div>').join('') + '</div></div>';
  if (miss.length) {
    h += '<h2>Words to fix (' + miss.length + ')</h2>' + miss.map(r => { const best = closest(r.id, r.typed || ''), tr = traps(best); return '<div class="card"><div class="trap">' + tr.html + '</div><div class="legend">' + tr.legend + '</div>' + (r.hinted ? '<p class="small" style="margin:0">You needed a hint on this one, so it counts as a word to practise.</p>' : diffHTML(r.typed || '', best)) + '</div>'; }).join('');
  } else h += '<div class="box get"><span class="lab">Perfect</span><p>Every word was right first time.</p></div>';
  if (sess.exam && done) h += '<h2>All answers</h2><div class="tablewrap"><table><tr><th>#</th><th>Word</th><th>You typed</th></tr>' + sess.rows.map((r, i) => '<tr><td>' + (i + 1) + '</td><td class="k mono">' + esc(target(r.id)) + '</td><td class="mono" style="color:' + (r.ok ? 'var(--ok)' : 'var(--bad)') + '">' + (r.typed ? esc(r.typed) : '<i>no answer</i>') + (r.ok ? ' ✓' : '') + '</td></tr>').join('') + '</table></div>';
  h += '<div class="actions">' + (miss.length ? '<button class="primary" id="again">Practise the ' + miss.length + ' missed word' + (miss.length > 1 ? 's' : '') + ' now</button>' : '') + '<a class="ghost" style="text-decoration:none" href="#home">Back to home</a></div>';
  app.innerHTML = h;
  const again = $('#again'); if (again) again.onclick = () => startSession('mistakes', miss.map(r => r.id));
  sess = null;
}

function viewMistakes() {
  head('mistakes'); const ids = mistakeIds(), fixed = []; for (let i = 0; i < N; i++) { const r = get(i); if (r && r.x && r.b >= MASTER) fixed.push(i); }
  let h = '<div class="hero"><h1>My mistakes</h1><p class="sub">Every word you got wrong, with the wrong versions you typed. A word leaves this list when you have recalled it correctly three times over several days.</p></div>';
  h += '<div class="stats"><div class="stat"><div class="n">' + ids.length + '</div><div class="t">To fix</div></div><div class="stat"><div class="n">' + fixed.length + '</div><div class="t">Fixed</div></div></div>';
  if (ids.length) h += '<div class="actions"><button class="primary" id="rt">Retest these words (' + Math.min(40, ids.length) + ')</button></div>';
  h += errBlock();
  h += '<h2>To fix</h2>' + (ids.length ? ids.map(id => { const r = get(id), tags = Object.keys(r.e || {}).map(k => LABEL[k]).join(', '); return '<div class="mrow"><button class="sp" data-say="' + id + '" aria-label="Hear it">' + SPK + '</button><div><span class="w">' + esc(target(id)) + '</span>' + (r.bad || []).map(b => '<span class="bad">' + esc(b) + '</span>').join('') + '</div><span class="small">wrong ' + r.x + '×</span><div class="tags">' + esc(D.cats[catOf(id)].short) + (tags ? ' · ' + esc(tags) : '') + '</div></div>'; }).join('') : '<p class="small">No mistakes to fix. Take the daily review or the exam test and they will appear here.</p>');
  app.innerHTML = h;
  const rt = $('#rt'); if (rt) rt.onclick = () => startSession('mistakes', ids.slice(0, 40));
  $$('[data-say]').forEach(b => { b.onclick = () => say(target(+b.dataset.say), S.set.rate); });
}
function viewRules() {
  head('rules');
  app.innerHTML = '<div class="hero"><h1>Rules and tips</h1><p class="sub">The five trap families from your PDF, and how this lab uses them.</p></div>' +
    '<div class="tablewrap"><table><tr><th>Trap</th><th>Common mistake</th><th>Correct spelling</th><th>Memory tip</th></tr>' + D.traps.map(t => '<tr><td class="k">' + esc(t[0]) + '</td><td class="mono" style="color:var(--bad)">' + esc(t[1]) + '</td><td class="mono"><b>' + esc(t[2]) + '</b></td><td>' + esc(t[3]) + '</td></tr>').join('') + '</table></div>' +
    '<h2>The three-step routine</h2>' + D.protocol.map((p, i) => '<div class="box ' + ['tech', 'same', 'get'][i] + '"><span class="lab">' + (i + 1) + '. ' + esc(p[0]) + '</span><p>' + esc(p[1]) + '</p></div>').join('') +
    '<h2>How the lab applies it</h2><div class="card"><ol><li><b>Dictation:</b> the daily review and the exam test say a word and you type it.</li><li><b>Trap highlighting:</b> after every mistake the word is shown with its doubled letters, silent letters and ending vowels marked, then you type it three times.</li><li><b>Transfer check:</b> the lab accepts British and American spellings, so check which one you use and keep it consistent in a test.</li></ol></div>' +
    '<h2>Spellings the lab accepts</h2><div class="card"><p>Both of these are accepted (the first is the spelling in your list):</p><p class="mono small">' + Object.keys(D.alt).map(k => esc(D.words[k]) + ' / ' + esc(D.alt[k].join(' / '))).join(' · ') + '</p>' +
    '<p class="small">Three entries in the PDF are written as one word but are normally two: <b>air conditioner</b>, <b>board game</b>, <b>bed sheet</b>. The lab teaches the two-word forms.</p></div>';
}
function viewBrowse() {
  head('browse');
  app.innerHTML = '<div class="hero"><h1>Word list</h1><p class="sub">All ' + N + ' words for reference. Tap a word to hear it. Coloured dots show your progress.</p></div><input class="search" id="q" placeholder="Search words…" autocomplete="off" spellcheck="false"><div id="wl"></div>';
  const draw = () => {
    const q = norm($('#q').value); let h = '';
    D.cats.forEach((c, ci) => {
      let ws = ''; for (let i = c.start; i < c.end; i++) { const t = target(i); if (q && t.toLowerCase().indexOf(q) < 0) continue; const r = get(i); const k = r && r.x && r.b < MASTER ? 'x' : r && r.b >= MASTER ? 'm' : r && r.s ? 'l' : ''; ws += '<span class="wchip" data-say="' + i + '"><span class="dotk ' + k + '"></span>' + esc(t) + '</span>'; }
      if (ws) h += '<h3>' + (ci + 1) + '. ' + esc(c.short) + '</h3><div>' + ws + '</div>';
    });
    $('#wl').innerHTML = h || '<p class="small">No word matches.</p>';
    $$('#wl [data-say]').forEach(b => { b.onclick = () => say(target(+b.dataset.say), S.set.rate); });
  };
  $('#q').oninput = draw; draw();
}
function settings() {
  const vs = voices(), m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="box2"><h2 style="margin-top:0">Settings</h2><div class="row2"><label for="sv">Voice</label><select id="sv"><option value="">Automatic (best match)</option>' + vs.map(v => '<option value="' + esc(v.voiceURI) + '"' + (v.voiceURI === S.set.voice ? ' selected' : '') + '>' + esc(v.name + ' · ' + v.lang) + '</option>').join('') + '</select>' + (TTS.ok ? '' : '<span class="small">This browser cannot speak. The lab will flash each word instead.</span>') + '</div>' +
    '<div class="row2"><label for="sr">Speed</label><select id="sr">' + [[0.6, 'Slow'], [0.8, 'Normal for spelling'], [1, 'Natural']].map(r => '<option value="' + r[0] + '"' + (+S.set.rate === r[0] ? ' selected' : '') + '>' + r[1] + '</option>').join('') + '</select></div>' +
    '<div class="row2"><label>How each word is given</label><div class="seg" id="sp">' + [['hear', 'Hear it'], ['see', 'See it briefly'], ['both', 'Both']].map(p => '<button data-v="' + p[0] + '"' + (S.set.prompt === p[0] ? ' class="on"' : '') + '>' + p[1] + '</button>').join('') + '</div><span class="small">The exam test always uses audio.</span></div>' +
    '<div class="row2"><label for="sf">Seconds the word stays visible</label><select id="sf">' + [1, 2, 3, 5].map(n => '<option' + (+S.set.flash === n ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></div>' +
    '<div class="row2"><label for="sz">Words in the daily review</label><select id="sz">' + [20, 40, 60].map(n => '<option' + (+S.set.size === n ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></div>' +
    '<div class="actions"><button class="ghost sm" id="tv">Test the voice</button><button class="primary sm" id="ok">Done</button><button class="danger sm" id="rs">Reset all progress</button></div></div>';
  document.body.appendChild(m);
  $('#sv', m).onchange = e => { S.set.voice = e.target.value; save(); }; $('#sr', m).onchange = e => { S.set.rate = +e.target.value; save(); };
  $('#sf', m).onchange = e => { S.set.flash = +e.target.value; save(); }; $('#sz', m).onchange = e => { S.set.size = +e.target.value; save(); };
  $$('#sp button', m).forEach(b => { b.onclick = () => { S.set.prompt = b.dataset.v; save(); $$('#sp button', m).forEach(x => x.classList.toggle('on', x === b)); }; });
  $('#tv', m).onclick = () => say('accommodation', S.set.rate);
  $('#ok', m).onclick = () => { m.remove(); route(); };
  let armed = false; $('#rs', m).onclick = e => { if (!armed) { armed = true; e.target.textContent = 'Click again to erase everything'; return; } S = JSON.parse(JSON.stringify(DEF)); save(); m.remove(); sess = null; location.hash = '#home'; route(); };
  m.onclick = e => { if (e.target === m) m.remove(); };
}
function route() {
  const h = (location.hash || '#home').slice(1).split('/');
  if (h[0] === 'test' && sess && sess.skipRoute) { sess.skipRoute = false; return; }
  clearTimeout(timer);
  if (h[0] === 'test') { if (sess) { renderSession(); return; } location.hash = '#home'; return; }
  if (sess && h[0] !== 'test') sess = null;
  if (h[0] === 'setup' && D.cats[+h[1]]) viewSetup(+h[1]);
  else if (h[0] === 'mistakes') viewMistakes();
  else if (h[0] === 'rules') viewRules();
  else if (h[0] === 'browse') viewBrowse();
  else viewHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
$('#setbtn').onclick = settings;
window.SPLAB = { classify, traps, isCorrect, closest, target, forms, silentSet };
route();
})();

</script>
</body>
